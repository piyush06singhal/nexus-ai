name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ─────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector-enabled image: the migration round-trip below exercises
        # migration 0015 (CREATE EXTENSION vector).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_ci
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('apps/api/requirements-dev.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Test (pytest)
        run: pytest -v --tb=short

      - name: Migration round-trip
        env:
          DATABASE_URL: postgresql+psycopg://nexus:nexus_ci@localhost:5432/nexus
          AUTH_ENABLED: "false"
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: pgvector semantic memory (gated, PostgreSQL)
        env:
          PGVECTOR_TEST_DATABASE_URL: postgresql+psycopg://nexus:nexus_ci@localhost:5432/nexus
          AUTH_ENABLED: "false"
        run: pytest tests/test_pgvector.py -v

      - name: Production readiness report (non-blocking)
        env:
          DATABASE_URL: postgresql+psycopg://nexus:nexus_ci@localhost:5432/nexus
          AUTH_ENABLED: "false"
        run: python -m app.checks.production_readiness || true

  # ── Frontend ────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test (vitest)
        run: npx vitest run

      - name: Build
        run: npm run build

  # ── Docker ──────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f infrastructure/docker/Dockerfile.api -t nexus-api .

      - name: Build Web image
        run: docker build -f infrastructure/docker/Dockerfile.web -t nexus-web .

  # ── Docker push (GHCR) — production deploy images ───────────────────────
  # On every push to main, publish the api+web images to GitHub Container
  # Registry so `scripts/deploy.sh` can pull and run them on any Docker host.
  # Gated to *pushes to main* (not pull_requests), so forks never trigger it;
  # publishing needs the packages:write permission, which the repo opts into.
  # `GHCR_TOKEN` (optional) overrides the default GITHUB_TOKEN for hosts that
  # want a dedicated registry credential.
  docker-push:
    name: Push images to GHCR
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_BASE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/nexus-api:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/nexus-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.web
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/nexus-web:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/nexus-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
