# NEXUS Grafana dashboard provisioning (docker-compose.monitoring.yml).
apiVersion: 1

providers:
  - name: nexus
    orgId: 1
    folder: NEXUS
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false