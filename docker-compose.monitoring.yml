# NEXUS monitoring overlay — Prometheus + Grafana for the API metrics registry.
#
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Adds an in-network scraper (Prometheus) hitting the API's token-free
# `/api/v1/system/metrics/prometheus` exposition, plus a provisioned Grafana
# (http://localhost:3001, admin/admin by default — change immediately) that
# ships a prebuilt NEXUS dashboard. Ports 3001/9090 are published to the host;
# in production, prefer the TLS overlay to collapse the host surface, or bind
# them to localhost only (127.0.0.1:3001:3000).

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      # Production: replace via a secret manager / GF_SECURITY_ADMIN_PASSWORD.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  promdata:
  grafana_data: